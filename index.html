<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC27 Pro Trader | Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              950: '#090d16',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Header / Navbar -->
  <header class="border-b border-dark-800 bg-dark-900/60 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
        </div>
        <div>
          <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">FC27 Pro Trader</h1>
          <p class="text-xs text-slate-400" id="last-updated">Synchronisation en cours...</p>
        </div>
      </div>

      <!-- Actions Rapides & Recherche -->
      <div class="flex items-center gap-4">
        <div class="relative">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Rechercher un joueur..." 
            class="bg-dark-800 border border-dark-700 text-sm rounded-xl px-4 py-2.5 pl-10 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 w-64 transition-all"
          >
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    
    <!-- Statistiques Globales (KPIs) -->
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-5 mb-8">
      <div class="bg-dark-900 border border-dark-800 rounded-2xl p-5 relative overflow-hidden shadow-sm">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Joueurs Suivis</div>
        <div class="text-3xl font-extrabold text-white mt-2" id="stat-cards">0</div>
        <div class="absolute right-4 bottom-4 text-indigo-500/10 font-black text-6xl select-none">#</div>
      </div>
      <div class="bg-dark-900 border border-dark-800 rounded-2xl p-5 relative overflow-hidden shadow-sm">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Prix Moyen Marché</div>
        <div class="text-3xl font-extrabold text-indigo-400 mt-2" id="stat-avg-price">0 cr</div>
        <div class="absolute right-4 bottom-4 text-indigo-500/10 font-black text-6xl select-none">CR</div>
      </div>
      <div class="bg-dark-900 border border-dark-800 rounded-2xl p-5 relative overflow-hidden shadow-sm">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Bénéfice Net Moyen</div>
        <div class="text-3xl font-extrabold text-emerald-400 mt-2" id="stat-avg-profit">0 cr</div>
        <div class="absolute right-4 bottom-4 text-emerald-500/10 font-black text-6xl select-none">+</div>
      </div>
      <div class="bg-dark-900 border border-dark-800 rounded-2xl p-5 relative overflow-hidden shadow-sm flex flex-col justify-between">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Filtre Stratégie / Tech</div>
        <select id="tech-filter" class="bg-dark-800 border border-dark-700 text-sm rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 mt-2 cursor-pointer">
          <option value="all">Toutes les Techniques</option>
          <option value="Flip">Tech Flip</option>
          <option value="Millibuu">Tech Millibuu</option>
        </select>
      </div>
    </div>

    <!-- Tableau Professionnel -->
    <div class="bg-dark-900 border border-dark-800 rounded-2xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-dark-800/50 text-slate-400 uppercase text-[11px] font-bold tracking-wider border-b border-dark-800 select-none">
            <tr>
              <th class="px-6 py-4 cursor-pointer hover:text-indigo-400 transition-colors" onclick="sortData('name')">Joueur <span id="sort-icon-name">⇅</span></th>
              <th class="px-6 py-4">Technique</th>
              <th class="px-6 py-4 cursor-pointer hover:text-indigo-400 transition-colors" onclick="sortData('price')">Prix Actuel <span id="sort-icon-price">⇅</span></th>
              <th class="px-6 py-4">Tendance 24h</th>
              <th class="px-6 py-4 text-indigo-400">Achat Cible</th>
              <th class="px-6 py-4">Revente Conseillée</th>
              <th class="px-6 py-4">Taxe (5%)</th>
              <th class="px-6 py-4 cursor-pointer hover:text-indigo-400 transition-colors" onclick="sortData('profit')">Bénéfice Net <span id="sort-icon-profit">▼</span></th>
            </tr>
          </thead>
          <tbody id="player-table-body" class="divide-y divide-dark-800/50">
            <tr>
              <td colspan="8" class="px-6 py-12 text-center text-slate-500">Chargement des données du marché...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Script JavaScript du Dashboard -->
  <script>
    let allCards = [];
    let currentSort = { column: 'profit', dir: 'desc' };

    async function loadPrices() {
      try {
        const response = await fetch('prices.json?t=' + Date.now());
        if (!response.ok) throw new Error("Fichier introuvable");
        const data = await response.json();

        allCards = (data.cards || []).map(card => {
          const price = Number(card.price) || 0;
          // Algorithme d'achat-revente pro
          const buyPrice = Math.round(price * 0.94); // -6% pour achat cible
          const sellPrice = Math.round(price * 1.06); // +6% pour revente
          const tax = Math.round(sellPrice * 0.05);
          const profit = sellPrice - tax - buyPrice;

          return {
            id: card.id,
            name: card.name,
            rating: card.rating || 83,
            price: price,
            change: Number(card.change) || 0,
            tech: card.tech || 'Flip',
            buyPrice: buyPrice,
            sellPrice: sellPrice,
            tax: tax,
            profit: profit,
            img: card.img || `https://cdn.futbin.com/content/fut27/img/players/p${card.id}.png`,
            history: card.history || [price, price]
          };
        });

        if (data.updated) {
          const date = new Date(data.updated);
          document.getElementById('last-updated').innerText = `Dernière synchro : ${date.toLocaleDateString('fr-FR')} à ${date.toLocaleTimeString('fr-FR')}`;
        }

        renderTable();
      } catch (err) {
        document.getElementById('player-table-body').innerHTML = `
          <tr><td colspan="8" class="px-6 py-12 text-center text-rose-400">
            Impossible de charger <code>prices.json</code>. Vérifiez que le fichier est bien présent.
          </td></tr>`;
      }
    }

    function generateSparkline(history, change) {
      if (!history || history.length < 2) return '';
      const min = Math.min(...history);
      const max = Math.max(...history);
      const range = (max - min) || 1;
      
      const points = history.map((val, idx) => {
        const x = (idx / (history.length - 1)) * 90 + 5;
        const y = 24 - ((val - min) / range) * 18;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const color = change >= 0 ? '#10b981' : '#f43f5e';
      return `
        <svg class="w-24 h-7 overflow-visible" viewBox="0 0 100 30">
          <polyline fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="${points}" />
        </svg>
      `;
    }

    function sortData(column) {
      if (currentSort.column === column) {
        currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.column = column;
        currentSort.dir = column === 'name' ? 'asc' : 'desc';
      }
      renderTable();
    }

    function renderTable() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const techFilter = document.getElementById('tech-filter').value;
      const tbody = document.getElementById('player-table-body');

      let filtered = allCards.filter(card => {
        const matchesSearch = card.name.toLowerCase().includes(search);
        const matchesTech = techFilter === 'all' || card.tech === techFilter;
        return matchesSearch && matchesTech;
      });

      const col = currentSort.column;
      const dirMult = currentSort.dir === 'asc' ? 1 : -1;
      filtered.sort((a, b) => {
        if (typeof a[col] === 'string') return a[col].localeCompare(b[col]) * dirMult;
        return (a[col] - b[col]) * dirMult;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-12 text-center text-slate-500">Aucun joueur trouvé.</td></tr>`;
        return;
      }

      let totalPrices = 0;
      let totalProfits = 0;

      tbody.innerHTML = filtered.map(card => {
        totalPrices += card.price;
        totalProfits += card.profit;

        const sparkline = generateSparkline(card.history, card.change);
        const techBadgeClass = card.tech === 'Flip' 
          ? 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20' 
          : 'bg-amber-500/10 text-amber-400 border-amber-500/20';

        return `
          <tr class="hover:bg-dark-800/40 transition-colors group">
            <td class="px-6 py-3.5 font-medium text-white">
              <div class="flex items-center gap-3">
                <div class="w-9 h-11 flex-shrink-0 bg-dark-800 rounded-lg border border-dark-700 overflow-hidden flex items-center justify-center">
                  <img src="${card.img}" alt="${card.name}" class="w-8 h-10 object-contain group-hover:scale-110 transition-transform duration-200" loading="lazy" onerror="this.src='https://cdn.futbin.com/content/fut27/players/${card.id}.png'"/>
                </div>
                <div>
                  <span class="font-bold text-slate-100 block">${card.name}</span>
                  <span class="text-xs text-slate-400">Note : ${card.rating}</span>
                </div>
              </div>
            </td>
            <td class="px-6 py-3.5">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${techBadgeClass}">
                ${card.tech}
              </span>
            </td>
            <td class="px-6 py-3.5 font-semibold text-slate-200">${card.price.toLocaleString('fr-FR')} cr</td>
            <td class="px-6 py-3.5">
              <div class="flex items-center gap-2">
                ${sparkline}
                <span class="text-xs font-bold ${card.change >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                  ${card.change >= 0 ? '+' : ''}${card.change.toFixed(1)}%
                </span>
              </div>
            </td>
            <td class="px-6 py-3.5 font-bold text-indigo-400">${card.buyPrice.toLocaleString('fr-FR')} cr</td>
            <td class="px-6 py-3.5 text-slate-300">${card.sellPrice.toLocaleString('fr-FR')} cr</td>
            <td class="px-6 py-3.5 text-rose-400/80">-${card.tax.toLocaleString('fr-FR')} cr</td>
            <td class="px-6 py-3.5 font-extrabold ${card.profit > 0 ? 'text-emerald-400' : 'text-slate-500'}">
              +${card.profit.toLocaleString('fr-FR')} cr
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('stat-cards').innerText = filtered.length;
      document.getElementById('stat-avg-price').innerText = `${Math.round(totalPrices / filtered.length).toLocaleString('fr-FR')} cr`;
      document.getElementById('stat-avg-profit').innerText = `+${Math.round(totalProfits / filtered.length).toLocaleString('fr-FR')} cr`;
    }

    document.getElementById('search-input').addEventListener('input', renderTable);
    document.getElementById('tech-filter').addEventListener('change', renderTable);

    loadPrices();
    // Actualisation automatique toutes les 20 secondes comme demandé
    setInterval(loadPrices, 20000);
  </script>
</body>
</html>
